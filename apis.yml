aid: eve-com
name: Eve Com
description: >-
  Eve.com was a dot-com era e-commerce retailer of prestige beauty and personal
  care products, founded in 1998 by Mariam Naficy and Varsha Rao. It raised
  venture funding from Lightspeed Venture Partners (1999) and reached a Series B
  before being acquired by Idealab in 2000, after which the business ceased
  independent operations. It is retained in the API Evangelist network only as a
  historical Lightspeed portfolio lead; it published no developer program, API,
  SDKs, or documentation. The eve.com domain is today operated by an unrelated
  entity (CCP Games / the EVE Online game universe) and is not a surface for this
  company, so no live API or developer artifacts can be harvested for it.
